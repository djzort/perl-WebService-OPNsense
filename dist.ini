name    = WebService-OPNsense
version = 0.002
author  = Dean Hamstead <dean@fragfest.com.au>
license = MIT
copyright_holder = Dean Hamstead
copyright_year   = 2026
main_module = lib/WebService/OPNsense.pm

[@Basic]

[MetaProvides::Package]
[MetaJSON]
[MetaTests]
[MetaNoIndex]
directory = t

[ModuleBuild]
[GithubMeta]
issues = 1

[GatherDir / Dotfiles]
root = t
prefix = t
include_dotfiles = 1
exclude_match = ^(?!\.perlcriticrc)

[CPANFile]
[Test::Perl::Critic]
critic_config = t/.perlcriticrc
[Test::Kwalitee]
[Test::Compile]
[Test::EOF]
[FileFinder::ByName / EOLFiles]
skip = AUTHOR_PLEDGE
[Test::EOL]
finder = EOLFiles
[Test::Portability]
[Test::Legal]
[Test::NoTabs]
finder = EOLFiles
[Test::PAUSE::Permissions]
[Test::UnusedVars]
[Test::NoBreakpoints]
[Test::CleanNamespaces]
skip = ^WebService::OPNsense$
skip = ^WebService::OPNsense::Constants$
skip = ^WebService::OPNsense::Normalize$
[PodCoverageTests]
[PodSyntaxTests]
[RunExtraTests]
[CheckChangeLog]
[PkgVersion]
die_on_existing_version = 1
[PodWeaver]
[PerlTidy]

[Covenant]
version = 1
pledge_file = AUTHOR_PLEDGE

[Git::Contributors]
[ContributorsFile]
[Git::CheckFor::CorrectBranch]
release_branch = trunk
[Git::Remote::Check]
branch = trunk
[Git::Tag]

[PruneFiles]
match = ^dist\.ini
filename = .editorconfig
filename = .perltidyrc
filename = AGENTS.md
filename = PLAN.md
filename = README.md
filename = weaver.ini

[Clean]

[Prereqs]
Carp                 = 0
Const::Fast          = 0
Exporter::Shiny      = 0
Exporter::Tiny       = 0
JSON::MaybeXS        = 0
Moo                  = 0
namespace::clean     = 0
Ref::Util            = 0
strictures           = 2
URI::Escape          = 0
URI::Template        = 0
UUID::Tiny           = 0
WebService::Client   = 0
perl                 = 5.024

[Prereqs / TestRequires]
constant             = 0
Net::CIDR::Lite      = 0
Net::Netmask         = 0
NetAddr::IP          = 0
Test::LWP::UserAgent = 0
Test2::V1            = 1.302217
